<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击放烟花</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            z-index: 100;
        }
        
        .info h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>🎆 点击放烟花</h1>
        <p>点击屏幕任意位置燃放烟花</p>
    </div>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 粒子类
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.friction = 0.99;
                this.gravity = 0.05;
                this.decay = Math.random() * 0.015 + 0.005;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }
        
        // 烟花类
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.exploded = false;
                this.colors = [
                    '#ff0000', '#00ff00', '#0000ff', '#ffff00', 
                    '#ff00ff', '#00ffff', '#ff8800', '#ff0088',
                    '#8800ff', '#0088ff', '#ffffff'
                ];
                this.explode();
            }
            
            explode() {
                const particleCount = 80;
                const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 * i) / particleCount;
                    const velocity = {
                        x: Math.cos(angle) * (Math.random() * 6 + 2),
                        y: Math.sin(angle) * (Math.random() * 6 + 2)
                    };
                    this.particles.push(new Particle(this.x, this.y, color, velocity));
                }
                
                this.exploded = true;
            }
            
            update() {
                this.particles = this.particles.filter(particle => {
                    particle.update();
                    return particle.alpha > 0;
                });
                
                return this.particles.length > 0;
            }
            
            draw() {
                this.particles.forEach(particle => {
                    particle.draw();
                });
            }
        }
        
        // 存储所有烟花
        let fireworks = [];
        
        // 鼠标点击事件
        canvas.addEventListener('click', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            fireworks.push(new Firework(x, y));
        });
        
        // 自动随机发射烟花
        function autoLaunch() {
            if (fireworks.length < 10 && Math.random() < 0.05) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height / 2);
                fireworks.push(new Firework(x, y));
            }
            setTimeout(autoLaunch, 100);
        }
        
        autoLaunch();
        
        // 动画循环
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            fireworks = fireworks.filter(firework => {
                firework.draw();
                return firework.update();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
