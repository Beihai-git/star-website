<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活打卡记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .daily-quote {
            text-align: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 1.2em;
            font-style: italic;
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .calendar-section, .camera-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .calendar-header button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
        }

        .calendar-day:hover {
            background: #e0e0e0;
        }

        .calendar-day.today {
            background: #667eea;
            color: white;
        }

        .calendar-day.checked-in {
            background: #4caf50;
            color: white;
        }

        .calendar-day.checked-in::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 5px;
            font-size: 0.7em;
        }

        .calendar-day.empty {
            background: transparent;
            cursor: default;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            color: #667eea;
            padding: 10px 0;
        }

        .camera-container {
            text-align: center;
        }

        #videoElement {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
        }

        #photoCanvas {
            display: none;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .camera-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .camera-controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .camera-controls button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .camera-controls button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .checkin-info {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            border-left: 4px solid #4caf50;
        }

        .checkin-time {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
        }

        .checkin-photo {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        .checkin-note {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            color: #555;
        }

        .records-section {
            margin-top: 30px;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .records-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .record-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .record-date {
            font-weight: bold;
            color: #667eea;
            min-width: 120px;
        }

        .record-content {
            flex: 1;
        }

        .record-photo {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .record-quote {
            color: #666;
            font-style: italic;
            margin-top: 5px;
        }

        .empty-records {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .note-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            resize: vertical;
            min-height: 60px;
        }

        .note-input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 生活打卡记录 🌸</h1>
        
        <div class="daily-quote" id="dailyQuote">
            每一天都是新的开始，珍惜当下的美好时光 ✨
        </div>

        <div class="main-content">
            <div class="calendar-section">
                <h2 class="section-title">📅 日历</h2>
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">◀ 上月</button>
                    <span id="currentMonth"></span>
                    <button onclick="changeMonth(1)">下月 ▶</button>
                </div>
                <div class="calendar-grid">
                    <div class="day-name">日</div>
                    <div class="day-name">一</div>
                    <div class="day-name">二</div>
                    <div class="day-name">三</div>
                    <div class="day-name">四</div>
                    <div class="day-name">五</div>
                    <div class="day-name">六</div>
                </div>
                <div class="calendar-grid" id="calendarDays"></div>
            </div>

            <div class="camera-section">
                <h2 class="section-title">📸 今日打卡</h2>
                <div class="camera-container">
                    <video id="videoElement" autoplay playsinline></video>
                    <canvas id="photoCanvas"></canvas>
                    
                    <div class="camera-controls">
                        <button id="startCamera" onclick="startCamera()">开启摄像头</button>
                        <button id="capturePhoto" onclick="capturePhoto()" disabled>拍照</button>
                        <button id="checkIn" onclick="checkIn()" disabled>完成打卡</button>
                        <button id="retakePhoto" onclick="retakePhoto()" style="display: none;">重拍</button>
                    </div>
                    
                    <textarea class="note-input" id="noteInput" placeholder="记录今天的心情和想法..."></textarea>
                    
                    <div class="checkin-info" id="checkinInfo" style="display: none;">
                        <div class="checkin-time" id="checkinTime"></div>
                        <img id="checkinPhoto" class="checkin-photo" style="display: none;">
                        <div class="checkin-note" id="checkinNote"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="records-section">
            <h2 class="section-title">📝 打卡记录</h2>
            <div class="records-list" id="recordsList">
                <div class="empty-records">还没有打卡记录，开始你的第一次打卡吧！</div>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let currentPhoto = null;
        let stream = null;
        let checkinRecords = JSON.parse(localStorage.getItem('checkinRecords')) || [];

        const quotes = [
            "每一天都是新的开始，珍惜当下的美好时光 ✨",
            "生活不是等待风暴过去，而是学会在雨中跳舞 💃",
            "今天的努力，是为了明天的更好 🌟",
            "保持热爱，奔赴山海 🏔️",
            "每一个不曾起舞的日子，都是对生命的辜负 🎭",
            "生活明朗，万物可爱 🌻",
            "做自己的太阳，无需凭借谁的光 ☀️",
            "愿你眼里有光，心中有爱 🌈",
            "慢一点也没关系，只要在前进就好 🚶",
            "所有的相遇都是久别重逢 💕",
            "生活原本沉闷，但跑起来就有风 🌬️",
            "保持好奇，保持热爱，保持前行 🔥"
        ];

        function getRandomQuote() {
            return quotes[Math.floor(Math.random() * quotes.length)];
        }

        function updateDailyQuote() {
            const today = new Date().toDateString();
            const savedQuote = localStorage.getItem('quote_' + today);
            const quote = savedQuote || getRandomQuote();
            localStorage.setItem('quote_' + today, quote);
            document.getElementById('dailyQuote').textContent = quote;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonth').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                calendarDays.appendChild(emptyDay);
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.textContent = day;
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayElement.classList.add('today');
                }
                
                if (checkinRecords.some(record => record.date === dateStr)) {
                    dayElement.classList.add('checked-in');
                }
                
                dayElement.onclick = () => showDayDetails(dateStr);
                calendarDays.appendChild(dayElement);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function showDayDetails(dateStr) {
            const record = checkinRecords.find(r => r.date === dateStr);
            if (record) {
                alert(`📅 ${dateStr}\n\n📸 ${record.note || '无备注'}\n\n💭 ${record.quote}`);
            }
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                document.getElementById('videoElement').srcObject = stream;
                document.getElementById('startCamera').style.display = 'none';
                document.getElementById('capturePhoto').disabled = false;
            } catch (err) {
                alert('无法访问摄像头，请确保已授权摄像头权限。');
                console.error('摄像头访问错误:', err);
            }
        }

        function capturePhoto() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('photoCanvas');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            currentPhoto = canvas.toDataURL('image/jpeg');
            
            document.getElementById('videoElement').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('capturePhoto').style.display = 'none';
            document.getElementById('retakePhoto').style.display = 'inline-block';
            document.getElementById('checkIn').disabled = false;
        }

        function retakePhoto() {
            currentPhoto = null;
            document.getElementById('videoElement').style.display = 'block';
            document.getElementById('photoCanvas').style.display = 'none';
            document.getElementById('capturePhoto').style.display = 'inline-block';
            document.getElementById('retakePhoto').style.display = 'none';
            document.getElementById('checkIn').disabled = true;
        }

        function checkIn() {
            if (!currentPhoto) {
                alert('请先拍照！');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            const note = document.getElementById('noteInput').value;
            const quote = getRandomQuote();

            const record = {
                date: dateStr,
                time: timeStr,
                photo: currentPhoto,
                note: note,
                quote: quote,
                timestamp: now.getTime()
            };

            checkinRecords.push(record);
            localStorage.setItem('checkinRecords', JSON.stringify(checkinRecords));

            document.getElementById('checkinTime').textContent = `📅 打卡时间：${dateStr} ${timeStr}`;
            document.getElementById('checkinPhoto').src = currentPhoto;
            document.getElementById('checkinPhoto').style.display = 'block';
            document.getElementById('checkinNote').textContent = note ? `💭 ${note}` : '';
            document.getElementById('checkinInfo').style.display = 'block';

            document.getElementById('checkIn').disabled = true;
            document.getElementById('noteInput').value = '';

            renderCalendar();
            renderRecords();

            alert('✅ 打卡成功！\n\n' + quote);
        }

        function renderRecords() {
            const recordsList = document.getElementById('recordsList');
            
            if (checkinRecords.length === 0) {
                recordsList.innerHTML = '<div class="empty-records">还没有打卡记录，开始你的第一次打卡吧！</div>';
                return;
            }

            const sortedRecords = [...checkinRecords].sort((a, b) => b.timestamp - a.timestamp);
            
            recordsList.innerHTML = sortedRecords.map(record => `
                <div class="record-item">
                    <div class="record-date">${record.date}</div>
                    <img src="${record.photo}" class="record-photo" alt="打卡照片">
                    <div class="record-content">
                        <div>${record.time}</div>
                        ${record.note ? `<div style="margin-top:5px;">${record.note}</div>` : ''}
                        <div class="record-quote">${record.quote}</div>
                    </div>
                </div>
            `).join('');
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        window.addEventListener('beforeunload', stopCamera);

        updateDailyQuote();
        renderCalendar();
        renderRecords();
    </script>
</body>
</html>
